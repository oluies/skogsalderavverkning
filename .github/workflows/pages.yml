name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'site/**'
      - 'scripts/build_pages.py'
      - 'scripts/verify.py'
      - '.github/workflows/pages.yml'
  # Dependabot's whole output here is PRs editing this workflow. Without a
  # pull_request trigger the first execution of a bumped action would be the
  # deploy after merge, so a bad major would break publishing with no signal.
  pull_request:
    paths:
      - 'frontend/**'
      - 'site/**'
      - 'scripts/build_pages.py'
      - 'scripts/verify.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Group by whether the run deploys. Pushes and manual dispatches both publish
# (see the `if:` gates below), so they share one serialised group and two
# deploy-pages calls can never race the same environment. PR builds only
# verify, so they are grouped per ref and superseded ones are cancelled.
#
# The grouping and the gates have to agree: a run that cannot deploy must not
# sit in the deploy group, or queuing it there cancels a deploy that is merely
# pending and the site silently stays on the previous artifact.
concurrency:
  group: pages-${{ (github.event_name == 'pull_request' && github.ref) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: VirtusLab/scala-cli-setup@v1.16.0
        with:
          jvm: temurin:21

      # Coursier's artifact cache dominates a cold build; the key follows the
      # using-directives, which are what pin the dependency set.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/scalacli
          key: scala-${{ hashFiles('frontend/project.scala') }}
          restore-keys: scala-

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Regenerated rather than trusted: verify.py then fails if it drifted
      # from the tables in the commit.
      - name: Generate translation key constants
        run: python3 scripts/gen_keys.py

      - name: Build Scala.js bundle
        working-directory: frontend
        run: scala-cli --power package . -o ../site/js/app.js --js -f --js-mode release

      - name: Verify
        run: python3 scripts/verify.py

      - name: Assemble dist
        run: python3 scripts/build_pages.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      # Publishing runs for pushes and manual dispatches; a pull request proves
      # the build and the checks pass under the proposed action versions
      # without deploying.
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    # Pushes and manual dispatches publish; pull requests only build and verify.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
