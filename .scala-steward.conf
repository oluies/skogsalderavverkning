# Group routine updates so the repo gets one PR a week rather than four.
pullRequests.grouping = [
  { name = "scala-js-stack", "title" = "Update Scala.js stack", "filter" = [{"group" = "*"}] }
]

# Scala.js and Scala itself move together with the toolchain; keep them visible
# rather than auto-grouped away.
updates.pin = []
commits.message = "build: update ${artifactName} to ${nextVersion}"
