name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'site/**'
      - 'scripts/build_pages.py'
      - 'scripts/verify.py'
      - '.github/workflows/pages.yml'
  # Dependabot's whole output here is PRs editing this workflow. Without a
  # pull_request trigger the first execution of a bumped action would be the
  # deploy after merge, so a bad major would break publishing with no signal.
  pull_request:
    paths:
      - 'frontend/**'
      - 'site/**'
      - 'scripts/build_pages.py'
      - 'scripts/verify.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow one concurrent deployment; don't cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: VirtusLab/scala-cli-setup@v1.16.0
        with:
          jvm: temurin:21

      # Coursier's artifact cache dominates a cold build; the key follows the
      # using-directives, which are what pin the dependency set.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/scalacli
          key: scala-${{ hashFiles('frontend/project.scala') }}
          restore-keys: scala-

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build Scala.js bundle
        working-directory: frontend
        run: scala-cli --power package . -o ../site/js/app.js --js -f --js-mode release

      - name: Verify
        run: python3 scripts/verify.py

      - name: Assemble dist
        run: python3 scripts/build_pages.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      # Publishing steps run only for pushes; a PR proves the build and the
      # checks pass under the proposed action versions without deploying.
      - uses: actions/configure-pages@v6
        if: github.event_name == 'push'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
