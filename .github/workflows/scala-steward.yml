name: Scala Steward

# Scala Steward reads the //> using dep directives in frontend/project.scala and
# opens a PR when Laminar, Scala or Scala.js move. Dependabot does not
# understand scala-cli directives, so it covers the GitHub Actions only and
# this covers the Scala side.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: scala-steward-org/scala-steward-action@v2
        with:
          # GITHUB_TOKEN is enough to open PRs. Note that PRs it opens will not
          # themselves trigger workflows - swap in a PAT or GitHub App token if
          # you want CI to run on Steward's PRs.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          author-email: orjan.lundberg@gmail.com
          author-name: Scala Steward
          # Steward reads a scala-cli project by running `scala-cli --power
          # export --sbt` and then loading the result with sbt. From scala-cli
          # 1.15.0 that export writes sbt.version=2.x, and sbt-scalajs is not
          # published for sbt 2 - so every run died resolving
          # org.scala-js:sbt-scalajs_sbt2_3:1.20.1. 1.14.0 is the last release
          # whose export pins sbt 1.x. This only affects how Steward reads the
          # dependencies; the site is built by the scala-cli in pages.yml, which
          # tracks the current release. Drop the pin once sbt-scalajs ships for
          # sbt 2, or once Steward passes --sbt-version to the export.
          scala-cli-version: 1.14.0
