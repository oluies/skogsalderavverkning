name: Scala Steward

# Scala Steward reads the //> using dep directives in frontend/project.scala and
# opens a PR when Laminar, Scala or Scala.js move. Dependabot does not
# understand scala-cli directives, so it covers the GitHub Actions only and
# this covers the Scala side.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: scala-steward-org/scala-steward-action@v2
        with:
          # GITHUB_TOKEN opens PRs here only because this repository allows it.
          # `pull-requests: write` above is necessary and not sufficient: the
          # repository setting "Allow GitHub Actions to create and approve pull
          # requests" (Settings -> Actions -> General) gates it as well, and with
          # that off the POST returns
          #
          #   403 GitHub Actions is not permitted to create or approve pull
          #       requests
          #
          # after Steward has already pushed its branch. The result is a pushed
          # `update/*` branch with no PR and a red workflow, which reads as a
          # Steward fault rather than a settings one. That is not hypothetical:
          # it is what oluies/p4rt-examples did for a week, and this repository
          # differs only in having the setting enabled.
          #
          # STEWARD_TOKEN removes the dependency on that setting, because a PAT
          # is not subject to it. Unset today, and the fallback keeps the
          # workflow working; set it to a fine-grained token scoped to this
          # repository with Contents: RW and Pull requests: RW.
          #
          # The previous note here also claimed PRs opened with GITHUB_TOKEN do
          # not trigger workflows. That is the documented rule, but it does not
          # hold in this repository: #2 `update/toolchain` was opened by Steward
          # under GITHUB_TOKEN and `pages.yml` still ran its `build` job on it.
          # Removed rather than repeated, since acting on it would mean adding a
          # PAT for a problem this repository does not have.
          github-token: ${{ secrets.STEWARD_TOKEN || secrets.GITHUB_TOKEN }}
          author-email: orjan.lundberg@gmail.com
          author-name: Scala Steward
