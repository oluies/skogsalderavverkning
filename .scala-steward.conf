# One grouped PR a week for routine library updates, so the repo does not get a
# separate PR per artifact.
#
# Scala and Scala.js are deliberately NOT grouped: a toolchain bump can break
# compilation in ways a library bump does not, and it deserves its own PR that
# can be reverted on its own.
pullRequests.grouping = [
  { name = "toolchain", title = "Update Scala toolchain", filter = [
      { group = "org.scala-lang" },
      { group = "org.scala-js" }
  ]},
  { name = "libraries", title = "Update Scala libraries", filter = [{ group = "*" }] }
]

commits.message = "build: update ${artifactName} to ${nextVersion}"
